<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 230" width="100%">
  <defs>
    <radialGradient id="vinylGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="55%" stop-color="#050507"/>
      <stop offset="58%" stop-color="#222228"/>
      <stop offset="61%" stop-color="#060608"/>
      <stop offset="82%" stop-color="#19191f"/>
      <stop offset="85%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <style>
      .card-bg {
        fill: #111115;
        stroke: rgba(255, 255, 255, 0.35);
        stroke-width: 1.5;
      }
      .vinyl-spin {
        transform-origin: 112px 115px;
        animation: spinRecord 9s linear infinite;
      }
      @keyframes spinRecord {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .pill-hdr {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 11px;
        letter-spacing: 2px;
        fill: #ffffff;
      }
      .proj-title {
        font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
        font-size: 29px;
        font-weight: 700;
        fill: #f5f5f7;
      }
      .proj-desc {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14.5px;
        fill: #a3a3ad;
      }
      .time-txt {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 11.5px;
        fill: #686873;
      }
      .tag-box {
        fill: rgba(255, 255, 255, 0.04);
        stroke: rgba(255, 255, 255, 0.16);
        stroke-width: 1;
      }
      .tag-txt {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 11.5px;
        fill: #f5f5f7;
      }
      .label-am {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 16px;
        font-weight: 700;
        fill: #000000;
      }
      .label-num {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8.5px;
        font-weight: 700;
        fill: #000000;
      }
    </style>
  </defs>

  <!-- Card Container -->
  <rect x="1" y="1" width="938" height="228" rx="8" class="card-bg"/>

  <!-- Spinning Vinyl Record -->
  <g class="vinyl-spin">
    <circle cx="112" cy="115" r="74" fill="url(#vinylGrad)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="112" cy="115" r="58" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="18 10"/>
    <circle cx="112" cy="115" r="44" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="12 8"/>
    <circle cx="112" cy="115" r="26" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>
    <text x="112" y="113" text-anchor="middle" class="label-am">AM</text>
    <text x="112" y="124" text-anchor="middle" class="label-num">0114</text>
    <circle cx="112" cy="115" r="3" fill="#000000"/>
  </g>

  <!-- Right Column Content -->
  <circle cx="222" cy="42" r="4" fill="#ffffff"/>
  <text x="234" y="46" class="pill-hdr">NOW SPINNING // FEATURED SYSTEM</text>

  <text x="218" y="82" class="proj-title">Sign Language Recognition System</text>
  <text x="218" y="110" class="proj-desc">A web-based system designed to recognize hand gestures and sign language using computer vision and machine learning.</text>

  <!-- Audio Progress Bar -->
  <text x="218" y="146" class="time-txt">02:45</text>
  <rect x="266" y="140" width="580" height="4" rx="2" fill="#272730"/>
  <rect x="266" y="140" width="394" height="4" rx="2" fill="#ffffff"/>
  <text x="858" y="146" class="time-txt">04:12</text>

  <!-- Tech Pills -->
  <g transform="translate(218, 168)">
    <rect x="0" y="0" width="68" height="26" rx="3" class="tag-box"/>
    <text x="34" y="17" text-anchor="middle" class="tag-txt">Python</text>

    <rect x="78" y="0" width="72" height="26" rx="3" class="tag-box"/>
    <text x="114" y="17" text-anchor="middle" class="tag-txt">OpenCV</text>

    <rect x="160" y="0" width="98" height="26" rx="3" class="tag-box"/>
    <text x="209" y="17" text-anchor="middle" class="tag-txt">TensorFlow</text>

    <rect x="268" y="0" width="138" height="26" rx="3" class="tag-box"/>
    <text x="337" y="17" text-anchor="middle" class="tag-txt">Machine Learning</text>

    <rect x="416" y="0" width="130" height="26" rx="3" class="tag-box"/>
    <text x="481" y="17" text-anchor="middle" class="tag-txt">Computer Vision</text>

    <rect x="556" y="0" width="134" height="26" rx="3" class="tag-box"/>
    <text x="623" y="17" text-anchor="middle" class="tag-txt">Web Development</text>
  </g>
</svg>
